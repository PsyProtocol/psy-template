[package]
name = "psy-market-wallet-verifier"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
bincode = "=1.3.3"
sha2 = "=0.10.9"
wasm-bindgen = "=0.2.126"
plonky2 = { git = "https://www.github.com/PsyProtocol/plonky2-hwa", rev = "736572e9dd3ca93566471cf5a2a1cb67a13fe01d", features = ["ts-rs"] }
psy_client_common = { path = "../../../../psy-node/client_prover/psy_core/psy_common" }
psy_client_data = { path = "../../../../psy-node/client_prover/psy_core/psy_data", default-features = false }
psy_crypto = { path = "../../../../psy-node/client_prover/psy_core/psy_crypto" }
psy_common_circuit = { path = "../../../../psy-node/client_prover/psy_circuit/psy_common_circuit" }
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
[patch."https://github.com/PsyProtocol/plonky2-hwa"]
plonky2 = { git = "https://www.github.com/PsyProtocol/plonky2-hwa", rev = "736572e9dd3ca93566471cf5a2a1cb67a13fe01d" }
plonky2_field = { git = "https://www.github.com/PsyProtocol/plonky2-hwa", rev = "736572e9dd3ca93566471cf5a2a1cb67a13fe01d" }
plonky2_maybe_rayon = { git = "https://www.github.com/PsyProtocol/plonky2-hwa", rev = "736572e9dd3ca93566471cf5a2a1cb67a13fe01d" }
plonky2_util = { git = "https://www.github.com/PsyProtocol/plonky2-hwa", rev = "736572e9dd3ca93566471cf5a2a1cb67a13fe01d" }
