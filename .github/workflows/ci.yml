name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Standards, Compliance & E2E Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Clean Standards (Zero Competitor References)
        run: npm run audit

      - name: Install legacy test toolchain and staging NFT v3 CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/PsyProtocol/psyup/mainnet-beta/install.sh | sh
          "$HOME/.psy/bin/psyup" install 0.1.1
          "$HOME/.psy/bin/psyup" install 0.1.0
          "$HOME/.psy/bin/dargo" --version
          "$HOME/.psy/toolchains/psy-0.1.1/bin/psy_user_cli" compile --help >/dev/null

      - name: Run native and E2E test matrix
        run: |
          source "$HOME/.psy/env"
          export PSY_USER_CLI="$HOME/.psy/toolchains/psy-0.1.1/bin/psy_user_cli"
          npm test
