name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Verify Standards, Compliance & E2E Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Clean Standards (Zero Competitor References)
        run: npm run audit

      - name: Run E2E Test Matrix
        run: npm run test:e2e
